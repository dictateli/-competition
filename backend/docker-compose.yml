services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: heliu_ai
      MYSQL_USER: heliu
      MYSQL_PASSWORD: heliu
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: heliu
      MINIO_ROOT_PASSWORD: heliu-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/heliu_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: heliu
      DB_PASSWORD: heliu
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # AI 模型：默认离线 Demo；接入 DeepSeek 时通过 .env 或 shell 传入
      HELIU_AI_PROVIDER: ${HELIU_AI_PROVIDER:-demo}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  redis-data:
  minio-data:
